<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>bug hunter — Jahidur Rahman</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #010409; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

.card {
  background: #0d1117;
  border-radius: 14px;
  border: 1px solid #21262d;
  padding: 32px;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 32px;
  font-family: 'Courier New', Courier, monospace;
  max-width: 780px;
  width: 100%;
}
.radar-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.info-col  { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }

.title      { font-size: 26px; font-weight: 700; color: #e6edf3; letter-spacing: -0.5px; }
.subtitle   { font-size: 12px; color: #1D9E75; margin-top: 4px; }
.divider    { height: 1px; background: #1D9E75; opacity: 0.25; }

.stack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack-card { border-radius: 8px; padding: 10px 14px; border: 1px solid; display: flex; flex-direction: column; gap: 3px; }
.stack-card.teal   { background: rgba(15,110,86,0.15);  border-color: #1D9E75; }
.stack-card.blue   { background: rgba(24,95,165,0.15);  border-color: #378ADD; }
.stack-card.purple { background: rgba(83,74,183,0.15);  border-color: #7F77DD; }
.stack-name        { font-size: 12px; font-weight: 700; }
.stack-name.teal   { color: #5DCAA5; }
.stack-name.blue   { color: #85B7EB; }
.stack-name.purple { color: #AFA9EC; }
.stack-sub         { font-size: 10px; }
.stack-sub.teal    { color: #085041; }
.stack-sub.blue    { color: #0C447C; }
.stack-sub.purple  { color: #3C3489; }

.tagline { font-size: 11px; color: #3B6D11; }

.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill  { font-size: 10px; color: #97C459; border: 1px solid #639922; background: rgba(234,243,222,0.06); border-radius: 20px; padding: 3px 12px; }

.footer-row   { display: flex; justify-content: space-between; align-items: center; }
.footer-name  { font-size: 10px; color: #444441; }

.live-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: #1D9E75; flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
}
.live-label { font-size: 11px; color: #1D9E75; }

@keyframes sweep  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
@keyframes o1 { from{transform:rotate(20deg)  translateX(90px)  rotate(-20deg)}  to{transform:rotate(-340deg) translateX(90px)  rotate(340deg)}  }
@keyframes o2 { from{transform:rotate(130deg) translateX(58px)  rotate(-130deg)} to{transform:rotate(-230deg) translateX(58px)  rotate(230deg)}  }
@keyframes o3 { from{transform:rotate(215deg) translateX(105px) rotate(-215deg)} to{transform:rotate(-145deg) translateX(105px) rotate(145deg)}  }
@keyframes o4 { from{transform:rotate(305deg) translateX(38px)  rotate(-305deg)} to{transform:rotate(-55deg)  translateX(38px)  rotate(55deg)}   }
@keyframes o5 { from{transform:rotate(72deg)  translateX(74px)  rotate(-72deg)}  to{transform:rotate(-288deg) translateX(74px) rotate(288deg)}   }
@keyframes ping { 0%,55%{opacity:0;r:0} 65%{opacity:0.7;r:7} 88%{opacity:0;r:20} 100%{opacity:0;r:20} }
@keyframes det  { 0%,55%{opacity:0;r:0} 68%{opacity:1;r:5}   85%{opacity:1;r:5}  100%{opacity:0;r:0}  }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes scanl { 0%,100%{opacity:0;transform:translateY(0)} 15%,85%{opacity:0.13} 50%{opacity:0.13;transform:translateY(190px)} }

.sweep-g { transform-origin: 120px 120px; animation: sweep 3.2s linear infinite; }
.b1 { transform-origin: 120px 120px; animation: o1 3.2s linear infinite; }
.b2 { transform-origin: 120px 120px; animation: o2 3.2s linear infinite; }
.b3 { transform-origin: 120px 120px; animation: o3 3.2s linear infinite; }
.b4 { transform-origin: 120px 120px; animation: o4 3.2s linear infinite; }
.b5 { transform-origin: 120px 120px; animation: o5 3.2s linear infinite; }
.ping-c  { animation: ping 3.2s ease-out infinite; }
.det-c   { animation: det  3.2s ease-in-out infinite; }
.pulse-c { animation: pulse 2s ease-in-out infinite; }
.scanline { animation: scanl 2.8s ease-in-out infinite; }
</style>
</head>
<body>
<div class="card">
  <div class="radar-col">
    <svg width="240" height="240" viewBox="0 0 240 240" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>Bug radar scanner</title>
      <defs>
        <clipPath id="rc"><circle cx="120" cy="120" r="108"/></clipPath>
        <radialGradient id="fanGrad" cx="0%" cy="50%" r="100%">
          <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <circle cx="120" cy="120" r="108" fill="none" stroke="#1D9E75" stroke-width="0.8" opacity="0.22"/>
      <circle cx="120" cy="120" r="75"  fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.16"/>
      <circle cx="120" cy="120" r="42"  fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.13"/>
      <line x1="12"  y1="120" x2="228" y2="120" stroke="#1D9E75" stroke-width="0.5" opacity="0.12"/>
      <line x1="120" y1="12"  x2="120" y2="228" stroke="#1D9E75" stroke-width="0.5" opacity="0.12"/>
      <line x1="44"  y1="44"  x2="196" y2="196" stroke="#1D9E75" stroke-width="0.4" opacity="0.07"/>
      <line x1="196" y1="44"  x2="44"  y2="196" stroke="#1D9E75" stroke-width="0.4" opacity="0.07"/>

      <rect class="scanline" x="12" y="12" width="216" height="1.5" fill="#1D9E75" opacity="0.13"/>

      <g clip-path="url(#rc)">
        <g class="sweep-g">
          <path d="M120 120 L228 120 A108 108 0 0 0 120 12 Z" fill="url(#fanGrad)"/>
          <line x1="120" y1="120" x2="228" y2="120" stroke="#1D9E75" stroke-width="1.8" opacity="0.9"/>
        </g>
      </g>

      <g class="b1">
        <circle cx="120" cy="120" r="5.5" fill="#E24B4A"/>
        <line x1="116" y1="116" x2="111" y2="111" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
        <line x1="124" y1="116" x2="129" y2="111" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
        <line x1="114" y1="120" x2="108" y2="120" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
        <line x1="126" y1="120" x2="132" y2="120" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
        <line x1="116" y1="124" x2="111" y2="129" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
        <line x1="124" y1="124" x2="129" y2="129" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
      </g>
      <g class="b2">
        <circle cx="120" cy="120" r="4" fill="#F09595"/>
        <line x1="117" y1="117" x2="113" y2="113" stroke="#F09595" stroke-width="1" opacity="0.85"/>
        <line x1="123" y1="117" x2="127" y2="113" stroke="#F09595" stroke-width="1" opacity="0.85"/>
        <line x1="115" y1="120" x2="110" y2="120" stroke="#F09595" stroke-width="1" opacity="0.85"/>
        <line x1="125" y1="120" x2="130" y2="120" stroke="#F09595" stroke-width="1" opacity="0.85"/>
        <line x1="117" y1="123" x2="113" y2="127" stroke="#F09595" stroke-width="1" opacity="0.85"/>
        <line x1="123" y1="123" x2="127" y2="127" stroke="#F09595" stroke-width="1" opacity="0.85"/>
      </g>
      <g class="b3">
        <circle cx="120" cy="120" r="5" fill="#EF9F27"/>
        <line x1="116" y1="116" x2="111" y2="111" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
        <line x1="124" y1="116" x2="129" y2="111" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
        <line x1="114" y1="120" x2="108" y2="120" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
        <line x1="126" y1="120" x2="132" y2="120" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
        <line x1="116" y1="124" x2="111" y2="129" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
        <line x1="124" y1="124" x2="129" y2="129" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
      </g>
      <g class="b4">
        <circle cx="120" cy="120" r="3.5" fill="#7F77DD"/>
        <line x1="117" y1="117" x2="114" y2="114" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
        <line x1="123" y1="117" x2="126" y2="114" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
        <line x1="116" y1="120" x2="112" y2="120" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
        <line x1="124" y1="120" x2="128" y2="120" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
        <line x1="117" y1="123" x2="114" y2="126" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
        <line x1="123" y1="123" x2="126" y2="126" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
      </g>
      <g class="b5">
        <circle cx="120" cy="120" r="4" fill="#5DCAA5"/>
        <line x1="117" y1="117" x2="113" y2="113" stroke="#5DCAA5" stroke-width="1" opacity="0.85"/>
        <line x1="123" y1="117" x2="127" y2="113" stroke="#5DCAA5" stroke-width="1" opacity="0.85"/>
        <line x1="115" y1="120" x2="110" y2="120" stroke="#5DCAA5" stroke-width="1" opacity="0.85"/>
        <line x1="125" y1="120" x2="130" y2="120" stroke="#5DCAA5" stroke-width="1" opacity="0.85"/>
        <line x1="117" y1="123" x2="113" y2="127" stroke="#5DCAA5" stroke-width="1" opacity="0.85"/>
        <line x1="123" y1="123" x2="127" y2="127" stroke="#5DCAA5" stroke-width="1" opacity="0.85"/>
      </g>

      <circle cx="120" cy="30" class="ping-c" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
      <circle cx="120" cy="30" class="det-c"  fill="#1D9E75"/>

      <circle cx="120" cy="120" r="7"   fill="#1D9E75"/>
      <circle cx="120" cy="120" r="3.5" fill="#0d1117"/>
      <circle cx="120" cy="120" r="1.5" fill="#1D9E75"/>
    </svg>

    <div style="display:flex;align-items:center;gap:8px;">
      <span class="live-dot"></span>
      <span class="live-label">scanning for bugs</span>
    </div>
  </div>

  <div class="info-col">
    <div>
      <div class="title">bug hunter</div>
      <div class="subtitle">// qa automation engineer</div>
    </div>

    <div class="divider"></div>

    <div class="stack-grid">
      <div class="stack-card teal">
        <span class="stack-name teal">Playwright</span>
        <span class="stack-sub teal">e2e testing</span>
      </div>
      <div class="stack-card blue">
        <span class="stack-name blue">TypeScript</span>
        <span class="stack-sub blue">typed automation</span>
      </div>
      <div class="stack-card purple">
        <span class="stack-name purple">CI/CD</span>
        <span class="stack-sub purple">GitHub Actions</span>
      </div>
      <div class="stack-card blue">
        <span class="stack-name blue">Docker</span>
        <span class="stack-sub blue">containers</span>
      </div>
    </div>

    <div class="tagline">detecting bugs so you ship with confidence</div>

    <div class="pills">
      <span class="pill">QA Engineer</span>
      <span class="pill">Page Object Model</span>
      <span class="pill">HTML report</span>
    </div>

    <div class="divider"></div>

    <div class="footer-row">
      <span class="footer-name">JAHIDUR RAHMAN</span>
      <span class="footer-name">github.com/jhrahman</span>
    </div>
  </div>
</div>
</body>
</html>
